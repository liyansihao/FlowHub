<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf9"><title>FlowHub · 商品审核</title><link rel="stylesheet" href="/styles.css?v=20260916-independent-submit"></head>
<body><div class="shell"><header class="topbar"><a class="brand" href="/">F<span>FlowHub<small>商品工作台</small></span></a><label class="reviewer">审核人<input id="reviewer" placeholder="姓名或代号" maxlength="80"></label></header>
<main><div class="heading"><div><h1>商品审核</h1><p>对照图片与规格确认同款。确认同款安排上架，确认不同款安排下架。</p></div><div class="sync"><span id="sync-state">准备连接</span><small id="snapshot-time">—</small></div></div>
<nav class="tabs" aria-label="工作区"><button id="products" aria-pressed="true">待审核 <span id="total">—</span></button><button id="all" aria-pressed="false">全部商品</button><button id="history" aria-pressed="false">操作记录</button></nav>
<div class="toolbar"><input id="search" type="search" placeholder="搜索 SKU、商品或店铺" aria-label="搜索商品"><select id="category" aria-label="商品状态"><option value="">全部状态</option><option value="pending">待审核</option><option value="processing">上下架处理中</option><option value="selling">已上架</option><option value="delisted">已下架 / 未上架</option><option value="blocked">处理异常</option></select><button id="refresh">刷新</button></div>
<div id="error" role="alert" hidden><span></span><button id="retry">重新加载</button></div><div id="notice" role="status" aria-live="polite"></div><p class="meta">空闲后首次提交可能等待最多 10 分钟；开始处理后恢复快速同步。请在操作记录中查看进度，无需重复提交。</p>
<section id="list" aria-label="商品列表" aria-busy="true"><div class="empty">正在加载商品…</div></section>
<div class="pagination"><span id="page-info">每页 12 件 · 按需加载</span><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div></main><footer>所有商品保留上下架操作，处理结果以平台回查为准。</footer></div><script type="module" src="/app.js?v=20260916-independent-submit"></script></body></html>
