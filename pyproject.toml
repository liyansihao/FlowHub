[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "flowhub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "cryptography>=44,<51"]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.setuptools.packages.find]
include = ["flowhub*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "vendor/compareBot/src"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["F", "I"]

[tool.setuptools.package-data]
flowhub = ["tariffs/*.json"]
