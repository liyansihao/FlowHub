[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comparebot"
version = "0.2.0"
description = "Ozon-to-1688 visual retrieval, reranking, and review routing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=11,<13",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
comparebot = "comparebot.interfaces.cli:main"
comparebot-screen = "comparebot.interfaces.screen_cli:main"
comparebot-calibration = "comparebot.interfaces.calibration_cli:main"

[project.optional-dependencies]
search1688 = [
    "search1688api==2.0.0",
]
dinov2 = [
    "numpy>=2,<3",
    "torch>=2.5,<3",
    "transformers>=4.48,<5",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comparebot = ["interfaces/static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
