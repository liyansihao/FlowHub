<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FlowHub · 店铺运营</title><link rel="stylesheet" href="/operations/style.css"></head><body>
<div class="shell"><header><a class="brand" href="/">F <span>FlowHub<small>商品工作台</small></span></a><nav aria-label="工作区"><a href="/operations/" aria-current="page">运营</a><a href="/">审核</a></nav></header>
<main><div class="heading"><div><p class="eyebrow">STORE OPERATIONS</p><h1>店铺运营</h1><p>集中跟进退款售后与零库存，处理完成后留下一条记录。</p></div><button id="refresh">刷新数据</button></div>
<p id="sync" class="meta">正在连接运营数据…</p><div id="error" role="alert" hidden></div><div id="notice" role="status"></div>
<section id="workspace" hidden><div class="tabs" role="group" aria-label="运营列表"><button data-kind="returns" aria-pressed="true">退款与售后 <span id="returns-count"></span></button><button data-kind="inventory" aria-pressed="false">零库存 <span id="inventory-count"></span></button></div>
<div class="toolbar"><select id="store" aria-label="选择店铺"><option value="">全部店铺</option></select><select id="handled" aria-label="处理状态"><option value="pending">待处理</option><option value="done">已经处理</option><option value="all">全部记录</option></select><select id="stage" aria-label="订单阶段"><option value="">全部订单阶段</option><option value="before_ship">发货前取消</option><option value="refused">交付时拒收</option><option value="uncollected">未领取退回</option><option value="after_delivery">签收后售后</option><option value="after_ship">发货后取消／退回</option><option value="unknown">阶段待核实</option></select><input id="search" type="search" placeholder="搜索商品、货号或订单" aria-label="搜索商品"><span id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th>商品 / 订单</th><th>店铺</th><th>平台状态</th><th>上次同步</th><th>内部跟进</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<p class="meta">“已经处理”仅记录内部跟进，不执行退款或补库存。零库存解除后再次出现，会重新进入待处理。商品名称可直接打开 Ozon 商品页。售后原因不等于责任认定；无签收证据的订单不计作签收后退货。</p></section>
</main><footer>退款与库存由本机运营服务同步；电脑离线时保留最后一次数据。买家消息仍在本机工作台处理。</footer></div><script type="module" src="/operations/app.js"></script></body></html>
